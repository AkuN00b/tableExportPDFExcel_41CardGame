<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empat Satu</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Empat Satu">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: radial-gradient(1200px circle at 20% 20%, rgba(13, 110, 253, 0.12), transparent 55%),
                radial-gradient(900px circle at 90% 10%, rgba(220, 53, 69, 0.12), transparent 45%),
                radial-gradient(1000px circle at 50% 100%, rgba(25, 135, 84, 0.10), transparent 55%);
        }

        .app-card {
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        [data-bs-theme="dark"] .app-card {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .score-input {
            min-width: 72px;
            max-width: 96px;
        }

        .input-error {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 .25rem rgba(220, 53, 69, .15) !important;
        }

        .sticky-actions {
            position: sticky;
            bottom: 0;
            z-index: 10;
            background: rgba(var(--bs-body-bg-rgb), 0.92);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        [data-bs-theme="dark"] .sticky-actions {
            border-top-color: rgba(255, 255, 255, 0.12);
        }

        .table thead th {
            white-space: nowrap;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .fab-mobile {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            display: none;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 575.98px) {
            .fab-mobile {
                display: flex;
            }
        }

        [data-bs-theme="dark"] .fab-mobile {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .swipe-hint {
            background: #dc3545 !important;
            transition: transform 0.15s ease;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-height: 320px;
        }

        @media (max-width: 575.98px) {
            .score-input {
                min-width: 52px;
                max-width: 64px;
                font-size: 0.875rem;
                padding: 0.25rem;
            }

            .table th, .table td {
                font-size: 0.8rem;
                padding: 0.3rem;
            }

            .btn-sm-mobile {
                font-size: 0.8rem;
                padding: 0.25rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand bg-body border-bottom sticky-top">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-semibold">Empat Satu</span>
            <div class="d-flex gap-2 ms-auto">
                <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" title="Ganti tema">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="installApp" class="btn btn-outline-success btn-sm" type="button" title="Install aplikasi" style="display:none;">
                    <i class="fas fa-download"></i>
                </button>
                <button id="newSession" class="btn btn-outline-danger btn-sm" type="button">
                    <i class="fas fa-rotate-left"></i> Sesi Baru
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9">
                <div class="card app-card overflow-hidden">
                    <div class="card-body p-3 p-md-4">
                        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-3">
                            <div>
                                <div class="h4 mb-1">Rekap Skor Permainan 41</div>
                                <div class="text-body-secondary small">Auto-save aktif di browser</div>
                            </div>
                            <div class="d-flex gap-2">
                                <span id="stepBadge1" class="badge text-bg-primary">1. Pemain</span>
                                <span id="stepBadge2" class="badge text-bg-secondary">2. Nama</span>
                                <span id="stepBadge3" class="badge text-bg-secondary">3. Skor</span>
                            </div>
                        </div>

                        <div id="step1">
                            <div class="row g-3 align-items-end">
                                <div class="col-12 col-md-7">
                                    <label for="numPlayers" class="form-label fw-semibold">Jumlah pemain</label>
                                    <div class="input-group">
                                        <button id="decrementPlayers" class="btn btn-outline-secondary" type="button" aria-label="Kurangi pemain">
                                            <i class="fas fa-minus"></i>
                                        </button>
                                        <input type="number" id="numPlayers" class="form-control text-center" value="2" readonly>
                                        <button id="incrementPlayers" class="btn btn-outline-secondary" type="button" aria-label="Tambah pemain">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                    </div>
                                    <div class="form-text">Bisa 2 sampai 4 pemain.</div>
                                </div>
                                <div class="col-12 col-md-5 d-grid">
                                    <button id="nextStep1" class="btn btn-primary">
                                        Lanjut <i class="fas fa-arrow-right ms-1"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div id="step2" style="display: none;">
                            <div class="mb-3">
                                <div class="fw-semibold mb-2">Nama pemain</div>
                                <div id="playerNames" class="row g-3"></div>
                            </div>
                            <div class="d-grid d-md-flex justify-content-md-end gap-2">
                                <button id="backToStep1" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-1"></i> Kembali
                                </button>
                                <button id="nextStep2" class="btn btn-primary">
                                    Lanjut <i class="fas fa-arrow-right ms-1"></i>
                                </button>
                            </div>
                        </div>

                        <div id="step3" style="display: none;">
                            <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center justify-content-between mb-3">
                                <div id="scoreSummary" class="d-flex flex-wrap gap-2"></div>
                                <div class="d-flex flex-wrap gap-2 justify-content-md-end">
                                    <button id="addRow" class="btn btn-outline-primary">
                                        <i class="fas fa-plus"></i> Tambah
                                    </button>
                                    <button id="showChart" class="btn btn-outline-info">
                                        <i class="fas fa-chart-line"></i> Grafik
                                    </button>
                                    <button id="editAllPlayers" class="btn btn-outline-warning">
                                        <i class="fas fa-edit"></i> Ubah Nama
                                    </button>
                                    <button id="finishGame" class="btn btn-success">
                                        <i class="fas fa-check"></i> Selesai
                                    </button>
                                </div>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-bordered align-middle" id="resultsTable">
                                    <thead>
                                        <tr id="tableHeader"></tr>
                                    </thead>
                                    <tbody></tbody>
                                    <tfoot>
                                        <tr id="totalRow"></tr>
                                    </tfoot>
                                </table>
                            </div>

                            <button id="fabAddRow" class="btn btn-primary fab-mobile" type="button" title="Tambah ronde">
                                <i class="fas fa-plus"></i>
                            </button>

                            <div class="sticky-actions mt-3 p-3 rounded-3" style="display:none;" id="exportBar">
                                <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
                                    <div class="fw-semibold">Permainan selesai. Siap export.</div>
                                    <div class="d-flex gap-2">
                                        <button id="exportExcel" class="btn btn-success">
                                            <i class="fas fa-file-excel"></i> Excel
                                        </button>
                                        <button id="exportPdf" class="btn btn-danger">
                                            <i class="fas fa-file-pdf"></i> PDF
                                        </button>
                                        <button id="shareWa" class="btn btn-success" title="Bagikan ke WhatsApp">
                                            <i class="fab fa-whatsapp"></i> WA
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center text-body-secondary small mt-3">
                    Tip: data auto-save, jadi aman kalau kepencet refresh.
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="chartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Grafik Skor per Ronde</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="chart-container mx-auto">
                        <canvas id="scoreChartCanvas"></canvas>
                    </div>
                    <div id="chartEmpty" class="py-4 text-body-secondary">
                        <i class="fas fa-chart-line fa-3x mb-2"></i>
                        <p class="mb-0">Belum ada data. Tambah ronde skor dulu.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editAllPlayersModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ubah Nama Semua Pemain</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    <div id="playerInputsContainer" class="vstack gap-2"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="saveAllChanges">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        const STORAGE_KEY = 'empatSatu_state_v1';
        const THEME_KEY = 'empatSatu_theme_v1';
        const SCORE_MIN = 0;
        const SCORE_MAX = 41;

        const el = {
            step1: document.getElementById('step1'),
            step2: document.getElementById('step2'),
            step3: document.getElementById('step3'),
            stepBadge1: document.getElementById('stepBadge1'),
            stepBadge2: document.getElementById('stepBadge2'),
            stepBadge3: document.getElementById('stepBadge3'),
            numPlayers: document.getElementById('numPlayers'),
            playerNames: document.getElementById('playerNames'),
            tableHeader: document.getElementById('tableHeader'),
            tableBody: document.querySelector('#resultsTable tbody'),
            totalRow: document.getElementById('totalRow'),
            scoreSummary: document.getElementById('scoreSummary'),
            exportBar: document.getElementById('exportBar'),
            themeToggle: document.getElementById('themeToggle'),
            newSession: document.getElementById('newSession'),
            backToStep1: document.getElementById('backToStep1')
        };

        const editPlayersModal = new bootstrap.Modal(document.getElementById('editAllPlayersModal'));

        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            const icon = theme === 'dark' ? 'fa-sun' : 'fa-moon';
            el.themeToggle.innerHTML = `<i class="fas ${icon}"></i>`;
        }

        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            setTheme(savedTheme || 'light');
        }

        function setStep(step) {
            el.step1.style.display = step === 1 ? 'block' : 'none';
            el.step2.style.display = step === 2 ? 'block' : 'none';
            el.step3.style.display = step === 3 ? 'block' : 'none';

            el.stepBadge1.className = `badge ${step === 1 ? 'text-bg-primary' : 'text-bg-secondary'}`;
            el.stepBadge2.className = `badge ${step === 2 ? 'text-bg-primary' : 'text-bg-secondary'}`;
            el.stepBadge3.className = `badge ${step === 3 ? 'text-bg-primary' : 'text-bg-secondary'}`;
        }

        function clampPlayers(n) {
            return Math.max(2, Math.min(4, n));
        }

        function clampScore(n) {
            if (n === null || n === undefined || n === '') return '';
            const v = Number(n);
            if (Number.isNaN(v)) return '';
            return Math.max(SCORE_MIN, Math.min(SCORE_MAX, v));
        }

        function debounce(fn, wait) {
            let t;
            return (...args) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...args), wait);
            };
        }

        const saveStateDebounced = debounce(saveState, 250);

        function getPlayerNamesFromStep2(numPlayers) {
            const names = [];
            for (let i = 1; i <= numPlayers; i++) {
                const input = document.getElementById(`player${i}`);
                names.push((input?.value || '').trim());
            }
            return names;
        }

        function getPlayerNamesFromTable(numPlayers) {
            const names = [];
            for (let i = 1; i <= numPlayers; i++) {
                names.push((document.getElementById(`playerTableName${i}`)?.textContent || '').trim());
            }
            return names;
        }

        function buildPlayerInputs(numPlayers, presetNames = []) {
            el.playerNames.innerHTML = '';
            for (let i = 1; i <= numPlayers; i++) {
                const col = document.createElement('div');
                col.className = 'col-12 col-md-6';

                const label = document.createElement('label');
                label.className = 'form-label';
                label.setAttribute('for', `player${i}`);
                label.textContent = `Pemain ${i}`;

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-control';
                input.id = `player${i}`;
                input.value = presetNames[i - 1] || '';
                input.addEventListener('input', saveStateDebounced);

                col.appendChild(label);
                col.appendChild(input);
                el.playerNames.appendChild(col);
            }
        }

        function buildTable(numPlayers, playerNames) {
            el.tableHeader.innerHTML = '';
            el.totalRow.innerHTML = '';
            el.tableBody.innerHTML = '';
            el.scoreSummary.innerHTML = '';
            el.exportBar.style.display = 'none';

            const thIndex = document.createElement('th');
            thIndex.textContent = 'Ke-';
            thIndex.style.width = '1px';
            el.tableHeader.appendChild(thIndex);

            for (let i = 1; i <= numPlayers; i++) {
                const th = document.createElement('th');
                th.textContent = playerNames[i - 1] || `Pemain ${i}`;
                th.id = `playerTableName${i}`;
                el.tableHeader.appendChild(th);
            }

            const thAction = document.createElement('th');
            thAction.textContent = 'Aksi';
            thAction.style.width = '1px';
            el.tableHeader.appendChild(thAction);

            const thTotal = document.createElement('th');
            thTotal.textContent = 'Jumlah';
            thTotal.style.width = '1px';
            el.totalRow.appendChild(thTotal);

            for (let i = 0; i < numPlayers; i++) {
                const td = document.createElement('td');
                td.className = 'fw-semibold text-center';
                el.totalRow.appendChild(td);
            }
            const tdAction = document.createElement('td');
            el.totalRow.appendChild(tdAction);
        }

        function updateRowNumbers() {
            const rows = el.tableBody.querySelectorAll('tr');
            rows.forEach((row, index) => {
                const tdIndex = row.querySelector('td');
                if (tdIndex) tdIndex.textContent = index + 1;
            });
        }

        function getTotals(numPlayers) {
            const totals = Array(numPlayers).fill(0);
            const rows = el.tableBody.querySelectorAll('tr');
            rows.forEach(row => {
                for (let j = 1; j <= numPlayers; j++) {
                    const input = row.querySelector(`input[data-player="${j}"]`);
                    const value = parseInt(input?.value, 10);
                    if (!Number.isNaN(value)) totals[j - 1] += value;
                }
            });
            return totals;
        }

        function renderSummary(numPlayers) {
            const totals = getTotals(numPlayers);
            const names = getPlayerNamesFromTable(numPlayers);
            const max = totals.length ? Math.max(...totals) : 0;
            el.scoreSummary.innerHTML = '';

            for (let i = 0; i < numPlayers; i++) {
                const total = totals[i];
                const isLeader = total === max && el.tableBody.querySelectorAll('tr').length > 0;

                const badge = document.createElement('div');
                badge.className = `badge rounded-pill ${isLeader ? 'text-bg-success' : 'text-bg-secondary'} px-3 py-2`;
                badge.innerHTML = `<span class="me-2">${names[i] || `Pemain ${i + 1}`}</span><span class="fw-semibold">${total}</span>`;
                el.scoreSummary.appendChild(badge);
            }

            for (let i = 1; i <= numPlayers; i++) {
                el.totalRow.cells[i].textContent = totals[i - 1];
            }
        }

        function createScoreInput(playerIndex, initialValue) {
            const input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'numeric';
            input.autocomplete = 'off';
            input.className = 'form-control text-center score-input';
            input.dataset.player = String(playerIndex);
            input.value = initialValue === undefined || initialValue === null ? '' : String(initialValue);

            input.addEventListener('input', () => {
                const cleaned = input.value.replace(/[^0-9]/g, '').slice(0, 2);
                input.value = cleaned;

                const v = cleaned === '' ? '' : clampScore(parseInt(cleaned, 10));
                if (v === '') {
                    input.value = '';
                    input.classList.remove('input-error');
                } else if (String(v) !== cleaned) {
                    input.value = String(v);
                }

                const finalValue = input.value === '' ? NaN : parseInt(input.value, 10);
                if (!Number.isNaN(finalValue) && (finalValue < SCORE_MIN || finalValue > SCORE_MAX)) input.classList.add('input-error');
                else input.classList.remove('input-error');
                renderSummary(getNumPlayers());
                saveStateDebounced();
            });

            input.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === 'Tab') {
                    e.preventDefault();
                    const next = input.closest('td').nextElementSibling;
                    if (next && next.querySelector('input')) {
                        next.querySelector('input').focus();
                        next.querySelector('input').select();
                    }
                }
            });

            return input;
        }

        function addRow(scores) {
            const numPlayers = getNumPlayers();
            const newRow = document.createElement('tr');

            const tdIndex = document.createElement('td');
            tdIndex.className = 'text-center fw-semibold';
            tdIndex.textContent = el.tableBody.rows.length + 1;
            newRow.appendChild(tdIndex);

            for (let i = 1; i <= numPlayers; i++) {
                const td = document.createElement('td');
                td.className = 'text-center';
                td.appendChild(createScoreInput(i, scores?.[i - 1]));
                newRow.appendChild(td);
            }

            const tdDelete = document.createElement('td');
            tdDelete.className = 'text-center';
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-outline-danger btn-sm';
            deleteBtn.type = 'button';
            deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            deleteBtn.addEventListener('click', () => {
                newRow.dataset.originalDisplay = newRow.style.display;
                newRow.style.display = 'none';

                Swal.fire({
                    toast: true,
                    position: 'bottom',
                    icon: 'warning',
                    title: 'Baris dihapus',
                    showConfirmButton: false,
                    showCancelButton: true,
                    cancelButtonText: '<i class="fas fa-undo me-1"></i>Urungkan',
                    cancelButtonColor: '#0d6efd',
                    timer: 5000,
                    timerProgressBar: true,
                    didOpen: () => { renderSummary(getNumPlayers()); saveStateDebounced(); }
                }).then(result => {
                    if (result.dismiss === Swal.DismissReason.cancel) {
                        newRow.style.display = newRow.dataset.originalDisplay || '';
                        newRow.removeAttribute('data-original-display');
                        updateRowNumbers();
                        renderSummary(getNumPlayers());
                        saveStateDebounced();
                    } else {
                        newRow.remove();
                        updateRowNumbers();
                        renderSummary(getNumPlayers());
                        saveStateDebounced();
                    }
                });
            });
            tdDelete.appendChild(deleteBtn);
            newRow.appendChild(tdDelete);

            setupSwipe(newRow);

            el.tableBody.appendChild(newRow);

            const firstInput = newRow.querySelector('input');
            if (firstInput && !scores) {
                firstInput.focus();
                firstInput.select();
            }

            renderSummary(numPlayers);
            saveStateDebounced();
        }

        function validateNames(numPlayers) {
            const names = getPlayerNamesFromStep2(numPlayers);
            const errors = [];
            for (let i = 0; i < names.length; i++) {
                if (!names[i]) errors.push(`Nama pemain ${i + 1} tidak boleh kosong.`);
            }
            return { ok: errors.length === 0, names, errors };
        }

        function validateScores(numPlayers) {
            if (el.tableBody.rows.length === 0) {
                return { ok: false, message: 'Belum ada permainan yang ditambahkan.' };
            }

            let ok = true;
            el.tableBody.querySelectorAll('input.score-input').forEach(input => {
                if (!input.value.trim()) {
                    ok = false;
                    input.classList.add('input-error');
                } else {
                    input.classList.remove('input-error');
                }
            });

            if (!ok) return { ok: false, message: 'Masih ada input skor yang kosong.' };
            return { ok: true };
        }

        function setFinished(finished) {
            const numPlayers = getNumPlayers();
            document.getElementById('addRow').disabled = finished;
            document.getElementById('fabAddRow').style.display = finished ? 'none' : '';
            document.getElementById('finishGame').disabled = finished;
            document.getElementById('editAllPlayers').disabled = finished;
            document.getElementById('showChart').disabled = finished;
            el.tableBody.querySelectorAll('button').forEach(btn => btn.disabled = finished);
            el.tableBody.querySelectorAll('input').forEach(input => input.disabled = finished);
            el.exportBar.style.display = finished ? 'block' : 'none';
            renderSummary(numPlayers);
        }

        function getNumPlayers() {
            return clampPlayers(parseInt(el.numPlayers.value || '2', 10));
        }

        function getState() {
            const numPlayers = getNumPlayers();
            let step = 1;
            if (el.step2.style.display !== 'none') step = 2;
            if (el.step3.style.display !== 'none') step = 3;

            let playerNames = [];
            if (step === 1) playerNames = [];
            if (step === 2) playerNames = getPlayerNamesFromStep2(numPlayers);
            if (step === 3) playerNames = getPlayerNamesFromTable(numPlayers);

            const rounds = [];
            if (step === 3) {
                el.tableBody.querySelectorAll('tr').forEach(row => {
                    const scores = [];
                    for (let i = 1; i <= numPlayers; i++) {
                        const input = row.querySelector(`input[data-player="${i}"]`);
                        scores.push(input?.value === '' ? '' : parseInt(input.value, 10));
                    }
                    rounds.push(scores);
                });
            }

            const finished = el.exportBar.style.display !== 'none';

            return { step, numPlayers, playerNames, rounds, finished };
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(getState()));
            } catch (e) {}
        }

        function clearState() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) {}
        }

        function applyState(state) {
            const numPlayers = clampPlayers(state?.numPlayers || 2);
            el.numPlayers.value = String(numPlayers);

            buildPlayerInputs(numPlayers, state?.playerNames || []);

            if (state?.step === 1) {
                setStep(1);
                return;
            }

            if (state?.step === 2) {
                setStep(2);
                return;
            }

            const names = (state?.playerNames || []).slice(0, numPlayers).map(s => String(s || '').trim());
            buildTable(numPlayers, names);
            setStep(3);

            (state?.rounds || []).forEach(r => addRow(r));
            setFinished(!!state?.finished);
        }

        async function initStateFromStorage() {
            let state = null;
            try {
                state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            } catch (e) {}

            if (state && typeof state === 'object') {
                const res = await Swal.fire({
                    icon: 'question',
                    title: 'Lanjutkan sesi terakhir?',
                    text: 'Ada data tersimpan dari sesi sebelumnya.',
                    showCancelButton: true,
                    confirmButtonText: 'Lanjutkan',
                    cancelButtonText: 'Mulai baru'
                });

                if (res.isConfirmed) {
                    applyState(state);
                    return;
                }
                clearState();
            }

            applyState({ step: 1, numPlayers: 2, playerNames: [], rounds: [], finished: false });
        }

        document.getElementById('incrementPlayers').addEventListener('click', () => {
            el.numPlayers.value = String(clampPlayers(getNumPlayers() + 1));
            saveStateDebounced();
        });

        document.getElementById('decrementPlayers').addEventListener('click', () => {
            el.numPlayers.value = String(clampPlayers(getNumPlayers() - 1));
            saveStateDebounced();
        });

        document.getElementById('nextStep1').addEventListener('click', () => {
            const numPlayers = getNumPlayers();
            buildPlayerInputs(numPlayers);
            setStep(2);
            saveStateDebounced();
        });

        el.backToStep1.addEventListener('click', () => {
            setStep(1);
            saveStateDebounced();
        });

        document.getElementById('nextStep2').addEventListener('click', () => {
            const numPlayers = getNumPlayers();
            const { ok, names, errors } = validateNames(numPlayers);
            if (!ok) {
                Swal.fire({ icon: 'error', title: 'Error', text: errors.join(' ') });
                return;
            }
            buildTable(numPlayers, names);
            setStep(3);
            renderSummary(numPlayers);
            saveStateDebounced();
        });

        document.getElementById('addRow').addEventListener('click', () => addRow());

        document.getElementById('editAllPlayers').addEventListener('click', () => {
            const numPlayers = getNumPlayers();
            const container = document.getElementById('playerInputsContainer');
            container.innerHTML = '';
            const names = getPlayerNamesFromTable(numPlayers);

            for (let i = 1; i <= numPlayers; i++) {
                const group = document.createElement('div');
                group.className = 'vstack gap-1';

                const label = document.createElement('label');
                label.className = 'form-label mb-0';
                label.setAttribute('for', `playerName${i}`);
                label.textContent = `Pemain ${i}`;

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-control';
                input.id = `playerName${i}`;
                input.value = names[i - 1] || '';

                group.appendChild(label);
                group.appendChild(input);
                container.appendChild(group);
            }

            editPlayersModal.show();
        });

        document.getElementById('saveAllChanges').addEventListener('click', () => {
            const numPlayers = getNumPlayers();
            let changesMade = false;
            for (let i = 1; i <= numPlayers; i++) {
                const newName = (document.getElementById(`playerName${i}`)?.value || '').trim();
                const current = (document.getElementById(`playerTableName${i}`)?.textContent || '').trim();
                if (newName !== current) {
                    document.getElementById(`playerTableName${i}`).textContent = newName;
                    changesMade = true;
                }
            }
            if (!changesMade) {
                Swal.fire({ icon: 'info', title: 'Tidak ada perubahan', text: 'Nama pemain tidak berubah.' });
                return;
            }
            renderSummary(numPlayers);
            saveStateDebounced();
            editPlayersModal.hide();
        });

        document.getElementById('finishGame').addEventListener('click', async () => {
            const numPlayers = getNumPlayers();
            const validation = validateScores(numPlayers);
            if (!validation.ok) {
                Swal.fire({ icon: 'error', title: 'Error', text: validation.message });
                return;
            }

            const res = await Swal.fire({
                icon: 'question',
                title: 'Selesaikan permainan?',
                text: 'Setelah selesai, input akan dikunci sampai kamu mulai sesi baru.',
                showCancelButton: true,
                confirmButtonText: 'Selesai',
                cancelButtonText: 'Batal'
            });

            if (!res.isConfirmed) return;

            setFinished(true);
            const totals = getTotals(numPlayers);
            const names = getPlayerNamesFromTable(numPlayers);
            const max = Math.max(...totals);
            const winners = totals.map((t, i) => (t === max ? (names[i] || `Pemain ${i + 1}`) : null)).filter(Boolean);

            Swal.fire({
                icon: 'success',
                title: 'Permainan selesai',
                html: `Pemenang (skor tertinggi): <b>${winners.join(', ')}</b><br>Total: ${totals.join(' - ')}`
            });
            saveState();
        });

        document.getElementById('exportExcel').addEventListener('click', () => {
            const numPlayers = getNumPlayers();
            const names = getPlayerNamesFromTable(numPlayers);
            const totals = getTotals(numPlayers);
            const max = Math.max(...totals);
            const winners = totals.map((t, i) => (t === max ? (names[i] || `Pemain ${i + 1}`) : null)).filter(Boolean);

            const data = [];
            data.push(['Rekap Hasil Permainan Empat Satu']);
            data.push([`Tanggal Cetak: ${new Date().toLocaleString()}`]);
            data.push([`Pemenang (skor tertinggi): ${winners.join(', ')}`]);
            data.push([]);

            data.push(['Ke-', ...names]);

            el.tableBody.querySelectorAll('tr').forEach((tr, idx) => {
                const row = [idx + 1];
                for (let i = 1; i <= numPlayers; i++) {
                    const input = tr.querySelector(`input[data-player="${i}"]`);
                    row.push(input?.value ?? '');
                }
                data.push(row);
            });

            data.push(['Jumlah', ...totals]);

            const worksheet = XLSX.utils.aoa_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Rekap');
            XLSX.writeFile(workbook, 'rekap_permainan_41.xlsx');
        });

        document.getElementById('exportPdf').addEventListener('click', () => {
            const numPlayers = getNumPlayers();
            const names = getPlayerNamesFromTable(numPlayers);
            const totals = getTotals(numPlayers);
            const max = Math.max(...totals);
            const winners = totals.map((t, i) => (t === max ? (names[i] || `Pemain ${i + 1}`) : null)).filter(Boolean);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });

            const title = 'Rekap Hasil Permainan Empat Satu';
            const printedAt = `Tanggal Cetak: ${new Date().toLocaleString()}`;
            const winnerLine = `Pemenang (skor tertinggi): ${winners.join(', ')}`;

            doc.setFontSize(13);
            doc.text(title, 40, 44);
            doc.setFontSize(10);
            doc.setTextColor(90);
            doc.text(printedAt, 40, 62);
            doc.text(winnerLine, 40, 78);
            doc.setTextColor(0);

            const head = [['Ke-', ...names]];
            const body = [];
            el.tableBody.querySelectorAll('tr').forEach((tr, idx) => {
                const row = [String(idx + 1)];
                for (let i = 1; i <= numPlayers; i++) {
                    const input = tr.querySelector(`input[data-player="${i}"]`);
                    row.push(input?.value ?? '');
                }
                body.push(row);
            });
            body.push(['Jumlah', ...totals.map(t => String(t))]);

            const pageWidth = doc.internal.pageSize.getWidth();
            const margin = 40;
            const available = pageWidth - margin * 2;
            const firstCol = 44;
            const rawOther = Math.floor((available - firstCol) / numPlayers);
            const otherCol = Math.max(34, Math.min(56, rawOther));
            const tableWidth = firstCol + otherCol * numPlayers;

            const columnStyles = { 0: { cellWidth: firstCol, halign: 'center' } };
            for (let i = 1; i <= numPlayers; i++) {
                columnStyles[i] = { cellWidth: otherCol, halign: 'center' };
            }

            doc.autoTable({
                head,
                body,
                startY: 92,
                margin: { left: margin, right: margin },
                theme: 'striped',
                tableWidth,
                styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak', valign: 'middle' },
                headStyles: { fillColor: [33, 37, 41], textColor: 255 },
                columnStyles,
                didParseCell: function (data) {
                    const isLast = data.row.index === body.length - 1;
                    if (isLast) {
                        data.cell.styles.fontStyle = 'bold';
                        data.cell.styles.fillColor = [248, 249, 250];
                    }
                }
            });

            doc.save('rekap_permainan_41.pdf');
        });

        function generatePdfBlob() {
            const numPlayers = getNumPlayers();
            const names = getPlayerNamesFromTable(numPlayers);
            const totals = getTotals(numPlayers);
            const max = Math.max(...totals);
            const winners = totals.map((t, i) => (t === max ? (names[i] || `Pemain ${i + 1}`) : null)).filter(Boolean);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });

            const title = 'Rekap Hasil Permainan Empat Satu';
            const printedAt = `Tanggal Cetak: ${new Date().toLocaleString()}`;
            const winnerLine = `Pemenang (skor tertinggi): ${winners.join(', ')}`;

            doc.setFontSize(13);
            doc.text(title, 40, 44);
            doc.setFontSize(10);
            doc.setTextColor(90);
            doc.text(printedAt, 40, 62);
            doc.text(winnerLine, 40, 78);
            doc.setTextColor(0);

            const head = [['Ke-', ...names]];
            const body = [];
            el.tableBody.querySelectorAll('tr').forEach((tr, idx) => {
                const row = [String(idx + 1)];
                for (let i = 1; i <= numPlayers; i++) {
                    const input = tr.querySelector(`input[data-player="${i}"]`);
                    row.push(input?.value ?? '');
                }
                body.push(row);
            });
            body.push(['Jumlah', ...totals.map(t => String(t))]);

            const pageWidth = doc.internal.pageSize.getWidth();
            const margin = 40;
            const available = pageWidth - margin * 2;
            const firstCol = 44;
            const rawOther = Math.floor((available - firstCol) / numPlayers);
            const otherCol = Math.max(34, Math.min(56, rawOther));
            const tableWidth = firstCol + otherCol * numPlayers;

            const columnStyles = { 0: { cellWidth: firstCol, halign: 'center' } };
            for (let i = 1; i <= numPlayers; i++) {
                columnStyles[i] = { cellWidth: otherCol, halign: 'center' };
            }

            doc.autoTable({
                head, body,
                startY: 92,
                margin: { left: margin, right: margin },
                theme: 'striped',
                tableWidth,
                styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak', valign: 'middle' },
                headStyles: { fillColor: [33, 37, 41], textColor: 255 },
                columnStyles,
                didParseCell: function (data) {
                    if (data.row.index === body.length - 1) {
                        data.cell.styles.fontStyle = 'bold';
                        data.cell.styles.fillColor = [248, 249, 250];
                    }
                }
            });

            return doc.output('blob');
        }

        function buildShareText() {
            const numPlayers = getNumPlayers();
            const names = getPlayerNamesFromTable(numPlayers);
            const totals = getTotals(numPlayers);
            const max = Math.max(...totals);
            const winners = totals.map((t, i) => (t === max ? (names[i] || `Pemain ${i + 1}`) : null)).filter(Boolean);

            let text = 'Rekap Hasil Permainan Empat Satu\n';
            text += `Pemenang: ${winners.join(', ')}\n\n`;
            text += ['Ke-', ...names].join('\t') + '\n';
            el.tableBody.querySelectorAll('tr').forEach((tr, idx) => {
                const row = [idx + 1];
                for (let i = 1; i <= numPlayers; i++) {
                    const input = tr.querySelector(`input[data-player="${i}"]`);
                    row.push(input?.value ?? '');
                }
                text += row.join('\t') + '\n';
            });
            text += ['Jumlah', ...totals].join('\t');
            return text;
        }

        document.getElementById('shareWa').addEventListener('click', async () => {
            const blob = generatePdfBlob();
            const file = new File([blob], 'rekap_permainan_41.pdf', { type: 'application/pdf' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: 'Rekap Permainan Empat Satu',
                        text: 'Hasil rekap skor permainan 41',
                        files: [file]
                    });
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }

            const text = buildShareText();
            const encoded = encodeURIComponent(text);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
        });

        let scoreChart = null;
        const chartColors = ['#0d6efd', '#dc3545', '#198754', '#ffc107'];

        function updateChart() {
            const numPlayers = getNumPlayers();
            const names = getPlayerNamesFromTable(numPlayers);
            const rows = el.tableBody.querySelectorAll('tr');
            const canvas = document.getElementById('scoreChartCanvas');
            const empty = document.getElementById('chartEmpty');

            if (rows.length === 0) {
                canvas.style.display = 'none';
                empty.style.display = '';
                return;
            }
            canvas.style.display = '';
            empty.style.display = 'none';

            const labels = [];
            const datasets = [];

            for (let i = 0; i < rows.length; i++) labels.push(i + 1);

            for (let p = 1; p <= numPlayers; p++) {
                const data = [];
                rows.forEach(row => {
                    const input = row.querySelector(`input[data-player="${p}"]`);
                    const val = parseInt(input?.value, 10);
                    data.push(Number.isNaN(val) ? null : val);
                });
                datasets.push({
                    label: names[p - 1] || `Pemain ${p}`,
                    data,
                    borderColor: chartColors[p - 1],
                    backgroundColor: chartColors[p - 1] + '33',
                    tension: 0.2,
                    spanGaps: false,
                    pointRadius: 4,
                    pointHoverRadius: 6
                });
            }

            const ctx = canvas.getContext('2d');

            if (scoreChart) {
                scoreChart.data.labels = labels;
                scoreChart.data.datasets = datasets;
                scoreChart.update('none');
            } else {
                scoreChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { boxWidth: 12, padding: 12, font: { size: 11 } }
                            }
                        },
                        scales: {
                            y: {
                                min: 0,
                                max: 41,
                                ticks: { stepSize: 5 }
                            },
                            x: {
                                title: { display: true, text: 'Ronde ke-' }
                            }
                        }
                    }
                });
            }
        }

        document.getElementById('showChart').addEventListener('click', () => {
            updateChart();
            const chartModal = new bootstrap.Modal(document.getElementById('chartModal'));
            chartModal.show();
        });

        document.getElementById('chartModal').addEventListener('hidden.bs.modal', () => {
            if (scoreChart) {
                scoreChart.destroy();
                scoreChart = null;
            }
        });

        document.getElementById('fabAddRow').addEventListener('click', () => addRow());

        function setupSwipe(row) {
            let startX = 0;
            let currentX = 0;
            let swiping = false;

            row.addEventListener('touchstart', e => {
                if (e.touches.length === 1) {
                    startX = e.touches[0].clientX;
                    swiping = false;
                }
            }, { passive: true });

            row.addEventListener('touchmove', e => {
                if (e.touches.length === 1) {
                    currentX = e.touches[0].clientX;
                    const diff = startX - currentX;
                    if (diff > 10) {
                        swiping = true;
                        row.style.transform = `translateX(${-Math.min(diff, 80)}px)`;
                        row.style.transition = 'none';
                        row.style.opacity = 1 - Math.min(diff / 200, 0.5);
                    }
                }
            }, { passive: true });

            row.addEventListener('touchend', () => {
                if (!swiping) return;
                const diff = startX - currentX;
                row.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
                row.style.transform = '';
                row.style.opacity = '';

                if (diff > 80) {
                    const deleteBtn = row.querySelector('.btn-outline-danger');
                    if (deleteBtn) deleteBtn.click();
                }
                swiping = false;
                startX = 0;
                currentX = 0;
            }, { passive: true });
        }

        el.themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        el.newSession.addEventListener('click', async () => {
            const res = await Swal.fire({
                icon: 'warning',
                title: 'Mulai sesi baru?',
                text: 'Data sesi saat ini akan dihapus dari auto-save.',
                showCancelButton: true,
                confirmButtonText: 'Ya, mulai baru',
                cancelButtonText: 'Batal'
            });
            if (!res.isConfirmed) return;
            clearState();
            applyState({ step: 1, numPlayers: 2, playerNames: [], rounds: [], finished: false });
            saveState();
        });

        initTheme();
        initStateFromStorage();

        let deferredPrompt = null;
        const installBtn = document.getElementById('installApp');

        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = '';
            installBtn.addEventListener('click', async () => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
                const res = await deferredPrompt.userChoice;
                deferredPrompt = null;
            });
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
