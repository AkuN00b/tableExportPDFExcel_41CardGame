<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empat Satu</title>

    <!-- Link to the icon -->
    <link rel="icon" href="https://raw.githubusercontent.com/AkuN00b/tableExportPDFExcel_41CardGame/refs/heads/main/icon.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        .form-control {
            width: 100%; /* Lebar input 100% */
            min-width: 60px; /* Lebar minimum input */
        }
        td {
            min-width: 60px; /* Lebar minimum td */
        }
        .input-error {
            border: 2px solid red; /* Outline merah */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rekap Hasil Permainan Empat Satu</h1>

        <div id="step1" class="mb-3">
            <label for="numPlayers" class="form-label">Jumlah Pemain:</label>
            <div class="input-group">
                <button id="decrementPlayers" class="btn btn-outline-secondary" type="button"><i class="fas fa-minus"></i></button>
                <input type="number" id="numPlayers" class="form-control text-center" value="2" readonly>
                <button id="incrementPlayers" class="btn btn-outline-secondary" type="button"><i class="fas fa-plus"></i></button>
            </div>
            <button id="nextStep1" class="btn btn-primary mt-2"><i class="fas fa-arrow-right"></i> Selanjutnya</button>
        </div>

        <div id="step2" class="mb-3" style="display: none;">
            <label for="playerNames" class="form-label">Nama Pemain:</label>
            <div id="playerNames"></div>
            <button id="nextStep2" class="btn btn-primary mt-2"><i class="fas fa-arrow-right"></i> Selanjutnya</button>
        </div>

        <div id="step3" class="table-responsive" style="display: none;">
            <table class="table table-bordered text-nowrap" id="resultsTable">
                <thead>
                    <tr id="tableHeader">
                        <th width="1px">Permainan Ke-</th>
                        <!-- Kolom tambahan akan ditambahkan secara dinamis -->
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
                <tfoot>
                    <tr id="totalRow">
                        <th>Jumlah</th>
                        <!-- Kolom tambahan untuk total akan ditambahkan secara dinamis -->
                        <td></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
            
            <button id="addRow" class="btn btn-secondary"><i class="fas fa-plus"></i> Tambah Permainan</button>
            <button id="editAllPlayers" class="btn btn-warning"><i class="fas fa-edit"></i> Ubah Nama Semua Pemain</button>
            <button id="finishGame" class="btn btn-success"><i class="fas fa-check"></i> Selesai Permainan</button>
            <button id="exportExcel" class="btn btn-success" style="display: none;"><i class="fas fa-file-excel"></i> Export ke Excel</button>
            <button id="exportPdf" class="btn btn-danger" style="display: none;"><i class="fas fa-file-pdf"></i> Export ke PDF</button>
        </div>
    </div>

    <!-- Modal untuk Mengubah Nama Semua Pemain -->
    <div class="modal fade" id="editAllPlayersModal" tabindex="-1" role="dialog" aria-labelledby="editAllPlayersModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editAllPlayersModalLabel">Ubah Nama Semua Pemain</h5>
                    <button type="button" class="close" aria-label="Close" style="border: none; background: transparent; color: #dc3545; font-size: 1.2rem;" onclick="closeModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body" id="playerInputsContainer">
                    <!-- Input untuk nama pemain akan ditambahkan di sini -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Batal</button>
                    <button type="button" class="btn btn-primary" id="saveAllChanges">Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <!-- Tambahkan jQuery dan Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('incrementPlayers').addEventListener('click', function() {
            const numPlayers = document.getElementById('numPlayers');
            if (parseInt(numPlayers.value) < 4) {
                numPlayers.value = parseInt(numPlayers.value) + 1;
            }
        });

        document.getElementById('decrementPlayers').addEventListener('click', function() {
            const numPlayers = document.getElementById('numPlayers');
            if (parseInt(numPlayers.value) > 2) {
                numPlayers.value = parseInt(numPlayers.value) - 1;
            }
        });

        document.getElementById('nextStep1').addEventListener('click', function() {
            const numPlayers = document.getElementById('numPlayers').value;
            
            const playerNamesDiv = document.getElementById('playerNames');
            playerNamesDiv.innerHTML = '';

            for (let i = 1; i <= numPlayers; i++) {
                const div = document.createElement('div');
                div.className = 'mb-2';
                const label = document.createElement('label');
                label.textContent = 'Nama Pemain ' + i + ':';
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-control';
                input.id = 'player' + i;
                div.appendChild(label);
                div.appendChild(input);
                playerNamesDiv.appendChild(div);
            }

            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        });

        document.getElementById('nextStep2').addEventListener('click', function() {
            const numPlayers = document.getElementById('numPlayers').value;
            const tableHeader = document.getElementById('tableHeader');
            tableHeader.innerHTML = '<th width="1px">Permainan Ke-</th>';
            let allFilled = true;
            let errorMessage = "";

            for (let i = 1; i <= numPlayers; i++) {
                const playerName = document.getElementById('player' + i).value;
                if (!playerName.trim()) {
                    allFilled = false;
                    errorMessage += `Nama pemain ${i} tidak boleh kosong. `;
                } else {
                    const th = document.createElement('th');
                    th.textContent = playerName;
                    th.setAttribute('id', 'playerTableName' + i); // Menetapkan ID untuk th
                    tableHeader.appendChild(th);
                }
            }

            // Menambahkan header untuk kolom aksi
            const thAction = document.createElement('th');
            thAction.textContent = 'Aksi';
            thAction.style.width = '1px'; // Mengatur lebar kolom menjadi 1px
            tableHeader.appendChild(thAction);

            // Menambahkan kolom untuk total di baris total
            const totalRow = document.getElementById('totalRow');
            totalRow.innerHTML = '<th>Jumlah</th>';
            for (let i = 0; i < numPlayers; i++) {
                const td = document.createElement('td');
                totalRow.appendChild(td);
            }
            const tdAction = document.createElement('td');
            totalRow.appendChild(tdAction);

            if (!allFilled) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: errorMessage
                });
                return;
            }

            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
        });

        document.getElementById('addRow').addEventListener('click', function() {
            const numPlayers = document.getElementById('numPlayers').value;
            const tbody = document.querySelector('#resultsTable tbody');
            const newRow = document.createElement('tr');

            const tdIndex = document.createElement('td');
            tdIndex.textContent = tbody.rows.length + 1;
            newRow.appendChild(tdIndex);

            for (var i = 1; i <= numPlayers; i++) {
                var td = document.createElement('td');

                var input = document.createElement('input');
                input.type = 'number'; // Mengatur tipe input menjadi number
                input.className = 'form-control';
                input.maxLength = 2; // Ini tidak berfungsi untuk input type="number", tetapi bisa ditinggalkan
                input.min = 0; // Nilai minimum
                input.max = 41; // Nilai maksimum

                input.oninput = function() {  
                    // Menghapus karakter yang tidak valid  
                    this.value = this.value.replace(/[^0-9]/g, ''); // Hanya izinkan angka  
                  
                    // Validasi untuk memastikan nilai berada dalam rentang yang ditentukan  
                    if (this.value !== "" && (parseInt(this.value) > 41 || parseInt(this.value) < 0)) {  
                        this.value = ''; // Kosongkan input jika nilai tidak valid  
                        this.classList.add('input-error'); // Tambahkan kelas untuk outline merah
                        updateTotal();  
                        Swal.fire({  
                            icon: 'error',  
                            title: 'Error',  
                            text: 'Nilai harus antara 0 dan 41.'  
                        });  
                    } else {  
                        this.classList.remove('input-error'); // Hapus kelas jika nilai valid
                        updateTotal();  
                    }  
                };  

                // Tambahkan input ke td dan td ke newRow
                td.appendChild(input);
                newRow.appendChild(td);
            }

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-danger btn-sm';
            deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            deleteBtn.onclick = function() {
                newRow.remove();
                updateTotal();
                updateRowNumbers(); // Memperbarui nomor permainan setelah penghapusan
            };

            const tdDelete = document.createElement('td');
            tdDelete.appendChild(deleteBtn);
            newRow.appendChild(tdDelete);

            tbody.appendChild(newRow);
            updateTotal();
        });

        // Event listener untuk tombol "Ubah Nama Semua Pemain"
        document.getElementById('editAllPlayers').addEventListener('click', function() {
            const numPlayers = document.getElementById('numPlayers').value;
            const playerInputsContainer = document.getElementById('playerInputsContainer');
            playerInputsContainer.innerHTML = ''; // Kosongkan kontainer input

            for (let i = 1; i <= numPlayers; i++) {
                const playerName = $(`#playerTableName${i}`).text();
                playerInputsContainer.innerHTML += `
                    <div class="form-group mb-2">
                        <label for="playerName${i}">Nama Pemain ${i}: </label>
                        <input type="text" class="form-control" id="playerName${i}" value="${playerName}" required>
                    </div>
                `;
            }

            // Tampilkan modal
            $('#editAllPlayersModal').modal('show');
        });

        // Event listener untuk tombol "Simpan Perubahan"
        $('#saveAllChanges').on('click', function() {
            const numPlayers = document.getElementById('numPlayers').value;
            let changesMade = false; // Variabel untuk melacak apakah ada perubahan

            for (let i = 1; i <= numPlayers; i++) {
                const newPlayerName = $(`#playerName${i}`).val();
                const currentPlayerName = $(`#playerTableName${i}`).text(); // Ambil nama pemain saat ini

                // Bandingkan nama baru dengan nama saat ini
                if (newPlayerName !== currentPlayerName) {
                    $(`#playerTableName${i}`).text(newPlayerName); // Update nama pemain di tabel
                    changesMade = true; // Tandai bahwa ada perubahan
                }
            }

            // Jika tidak ada perubahan, tampilkan pesan
            if (!changesMade) {
                Swal.fire({
                    icon: 'info',
                    title: 'Tidak Ada Perubahan',
                    text: 'Tidak ada nama pemain yang diubah.'
                });
            } else {
                // Tutup modal jika ada perubahan
                $('#editAllPlayersModal').modal('hide');
            }
        });

        function updateTotal() {
            const numPlayers = document.getElementById('numPlayers').value;
            const tbody = document.querySelector('#resultsTable tbody');
            const totalRow = document.getElementById('totalRow');
            let totals = Array(parseInt(numPlayers)).fill(0);

            for (let i = 0; i < tbody.rows.length; i++) {
                const row = tbody.rows[i];
                for (let j = 1; j <= numPlayers; j++) {
                    const value = parseInt(row.cells[j].firstChild.value);
                    if (!isNaN(value)) {
                        totals[j - 1] += value;
                    }
                }
            }

            for (let i = 1; i <= numPlayers; i++) {
                totalRow.cells[i].textContent = totals[i - 1];
            }
        }

        // Fungsi untuk memperbarui nomor permainan
        function updateRowNumbers() {
            const tbody = document.querySelector('#resultsTable tbody');
            const rows = tbody.querySelectorAll('tr');
            rows.forEach((row, index) => {
                const tdIndex = row.querySelector('td'); // Ambil kolom pertama (nomor permainan)
                if (tdIndex) {
                    tdIndex.textContent = index + 1; // Update nomor permainan
                }
            });
        }

        function closeModal() {
            $('#editAllPlayersModal').modal('hide'); // Menutup modal
        }

        document.getElementById('finishGame').addEventListener('click', function() {
            const tbody = document.querySelector('#resultsTable tbody');
            if (tbody.rows.length === 0) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Tidak ada permainan yang ditambahkan.'
                });
                return;
            }

            let allRowsFilled = true;
            let errorMessage = []; // Menggunakan array untuk menyimpan pesan kesalahan

            for (let i = 0; i < tbody.rows.length; i++) {
                const row = tbody.rows[i];
                let rowErrors = []; // Array untuk menyimpan kesalahan di baris ini

                for (let j = 1; j < row.cells.length - 1; j++) {
                    const input = row.cells[j].firstChild; // Ambil input
                    if (!input.value.trim()) {
                        allRowsFilled = false;
                        rowErrors.push(`Kolom ${j} tidak boleh kosong.`); // Menyimpan kesalahan di baris ini
                        input.classList.add('input-error'); // Tambahkan kelas untuk outline merah
                    } else {
                        input.classList.remove('input-error'); // Hapus kelas jika input terisi
                    }
                }

                if (rowErrors.length > 0) {
                    errorMessage.push(`Baris ${i + 1}: ${rowErrors.join(', ')}`); // Menyimpan kesalahan di baris ini
                }
            }

            if (!allRowsFilled) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Perhatikan input yang belum diisi.', // Pesan kesalahan yang disederhanakan
                    html: 'Input kosong, harus diisi dan telah ditandai dengan kotak merah.' // Menjelaskan tanda pada input
                });
                return;
            }


            // Disable addRow, finishGame, and delete buttons
            document.getElementById('addRow').disabled = true;
            document.getElementById('finishGame').disabled = true;
            tbody.querySelectorAll('button.btn-danger').forEach(btn => btn.disabled = true);
            tbody.querySelectorAll('input').forEach(input => input.disabled = true);

            Swal.fire({
                icon: 'success',
                title: 'Permainan Selesai',
                text: 'Anda dapat mengekspor hasilnya ke Excel atau PDF sekarang.'
            });
            document.getElementById('exportExcel').style.display = 'inline-block';
            document.getElementById('exportPdf').style.display = 'inline-block';
        });

        document.getElementById('exportExcel').addEventListener('click', function() {
            const table = document.getElementById('resultsTable');
            const rows = table.querySelectorAll('tr');
            let data = [];

            // Add title
            data.push(["Rekap Hasil Permainan Empat Satu"]);
            data.push([`Tanggal Cetak: ${new Date().toLocaleString()}`]); // Add print date
            data.push([]); // Empty row

            // Extract header
            let header = [];
            rows[0].querySelectorAll('th').forEach((th, index) => {
                if (index < rows[0].querySelectorAll('th').length - 1) { // Exclude the last column (Aksi)
                    header.push(th.innerText);
                }
            });
            data.push(header);

            // Extract rows
            for (let i = 1; i < rows.length - 1; i++) { // Loop through all rows except the last row (total row)
                let row = [];
                rows[i].querySelectorAll('td').forEach((td, index) => {
                    if (index === 0) { // Include the first column (Nomor Permainan)
                        row.push(td.innerText);
                    } else if (index < rows[i].querySelectorAll('td').length - 1) { // Exclude the last column (Aksi)
                        row.push(td.firstChild ? td.firstChild.value : td.innerText);
                    }
                });
                data.push(row);
            }

            // Add total row
            let totalRowData = ['Jumlah'];
            for (let i = 1; i <= header.length - 1; i++) {
                let total = 0;
                rows.forEach(row => {
                    if (row.querySelectorAll('td')[i] && row.querySelectorAll('td')[i].firstChild) {
                        const value = parseInt(row.querySelectorAll('td')[i].firstChild.value);
                        if (!isNaN(value)) {
                            total += value;
                        }
                    }
                });
                totalRowData.push(total);
            }
            data.push(totalRowData);

            // Convert data array to worksheet
            const worksheet = XLSX.utils.aoa_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet 1");

            // Style the title
            worksheet['A1'].s = { font: { bold: true } };

            // Export the workbook to Excel file
            XLSX.writeFile(workbook, 'rekap_permainan_41.xlsx');
        });

        document.getElementById('exportPdf').addEventListener('click', function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const table = document.getElementById('resultsTable');
            const rows = table.querySelectorAll('tr');
            let data = [];

            // Extract header
            let header = [];
            rows[0].querySelectorAll('th').forEach((th, index) => {
                if (index < rows[0].querySelectorAll('th').length - 1) { // Exclude the last column (Aksi)
                    header.push(th.innerText);
                }
            });
            data.push(header);

            // Extract rows
            for (let i = 1; i < rows.length - 1; i++) { // Loop through all rows except the last row (total row)
                let row = [];
                rows[i].querySelectorAll('td').forEach((td, index) => {
                    if (index === 0) { // Include the first column (Nomor Permainan)
                        row.push(td.innerText);
                    } else if (index < rows[i].querySelectorAll('td').length - 1) { // Exclude the last column (Aksi)
                        row.push(td.firstChild ? td.firstChild.value : td.innerText);
                    }
                });
                data.push(row);
            }

            // Add total row
            let totalRowData = ['Jumlah'];
            for (let i = 1; i <= header.length - 1; i++) {
                let total = 0;
                rows.forEach(row => {
                    if (row.querySelectorAll('td')[i] && row.querySelectorAll('td')[i].firstChild) {
                        const value = parseInt(row.querySelectorAll('td')[i].firstChild.value);
                        if (!isNaN(value)) {
                            total += value;
                        }
                    }
                });
                totalRowData.push(total);
            }
            data.push(totalRowData);

            // Add the title and print date to the PDF
            doc.text('Rekap Hasil Permainan Empat Satu', 14, 10);
            doc.text(`Tanggal Cetak: ${new Date().toLocaleString()}`, 14, 18);

            // Add the data to the PDF
            doc.autoTable({
                head: [data[0]],
                body: data.slice(1),
                startY: 22
            });

            // Save the PDF
            doc.save('rekap_permainan_41.pdf');
        });
    </script>
</body>
</html>
